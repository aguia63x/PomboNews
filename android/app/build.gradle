plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pombonews.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pombonews.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}
