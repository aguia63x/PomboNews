<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Pombo News — Seu pombo de confiança.">
<title>Pombo News — Seu pombo de confiança</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4f6f9;--surface:#fff;--surface2:#eef2f6;--text:#111827;--muted:#667085;
  --line:#e4e7ec;--brand:#14233d;--brand2:#20395f;--accent:#f2b705;--shadow:0 12px 30px rgba(16,24,40,.08);
  --radius:20px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.header{max-width:1180px;margin:auto;padding:13px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;object-fit:cover;background:var(--brand)}
.brand strong{font-size:1.15rem;letter-spacing:-.03em}.brand small{display:block;color:var(--muted);font-size:.74rem;margin-top:1px}
.actions{margin-left:auto;display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);font-size:1.05rem}
.navwrap{max-width:1180px;margin:auto;overflow:auto;padding:0 18px 12px}
.nav{display:flex;gap:8px;white-space:nowrap}
.nav button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 13px;border-radius:999px;font-weight:700;font-size:.84rem}
.nav button.active{background:var(--brand);border-color:var(--brand);color:#fff}
main{max-width:1180px;margin:auto;padding:22px 18px 50px}
.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 13px}
.sectionhead h2{font-size:1.2rem;margin:0;letter-spacing:-.025em}
.sectionhead button{border:0;background:none;color:var(--brand2);font-weight:800}
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--brand);min-height:380px;box-shadow:var(--shadow)}
.slide{display:none;position:relative;height:380px}
.slide.active{display:block}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.heroFallback{height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;background:linear-gradient(135deg,#162945,#0c1526)}
.slidecontent{position:absolute;z-index:2;left:24px;right:24px;bottom:23px;color:#fff}
.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);font-size:.72rem;font-weight:800}
.slidecontent h1{font-size:clamp(1.45rem,3vw,2.25rem);line-height:1.08;max-width:850px;margin:10px 0 9px;letter-spacing:-.035em}
.meta{font-size:.78rem;color:rgba(255,255,255,.78)}
.read{display:inline-flex;margin-top:13px;padding:10px 15px;border-radius:11px;background:var(--accent);color:#171717;font-weight:900;font-size:.82rem}
.dots{position:absolute;z-index:4;right:22px;bottom:27px;display:flex;gap:6px}
.dot{width:8px;height:8px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.45)}
.dot.active{width:23px;border-radius:8px;background:#fff}
.latest{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(16,24,40,.045)}
.thumb{height:175px;background:var(--surface2);position:relative;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.fallback{font-size:2.2rem;text-align:center}.fallback span{display:block;font-size:.73rem;font-weight:800;margin-top:6px;color:var(--muted)}
.cardbody{padding:14px}.cat{font-size:.7rem;color:var(--brand2);font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.card h3{font-size:1rem;line-height:1.24;margin:7px 0 9px;letter-spacing:-.015em}
.cardmeta{font-size:.72rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.mini .thumb{height:130px}.mini h3{font-size:.92rem}
.empty{padding:34px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.search{display:none;position:fixed;z-index:80;inset:0;background:rgba(10,15,25,.55);padding:70px 18px}
.searchbox{max-width:680px;margin:auto;background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.searchbox input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;outline:none;background:var(--surface);color:var(--text)}
.searchbox .results{max-height:65vh;overflow:auto;margin-top:10px}
.result{padding:12px 4px;border-bottom:1px solid var(--line)}
.result b{display:block}.result small{color:var(--muted)}
.close{float:right;border:0;background:none;font-size:1.3rem;color:var(--muted)}
.saved{display:none}
.footer{border-top:1px solid var(--line);background:var(--surface);padding:28px 18px;color:var(--muted)}
.footerin{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
.footer strong{color:var(--text)}
@media(max-width:850px){.latest{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){
  .header{padding:11px 14px}.navwrap{padding-left:14px;padding-right:14px}main{padding:16px 14px 40px}
  .hero,.slide{height:330px;min-height:330px}.slidecontent{left:17px;right:17px;bottom:18px}.dots{right:17px;bottom:23px}
  .latest,.grid{grid-template-columns:1fr 1fr}.thumb{height:145px}.mini .thumb{height:115px}.cardbody{padding:11px}
  .card h3{font-size:.91rem}.brand small{display:none}
}
@media(max-width:430px){.latest,.grid{grid-template-columns:1fr}.latest .thumb{height:190px}}
.dark{--bg:#090e17;--surface:#101722;--surface2:#151e2b;--text:#f5f7fa;--muted:#98a2b3;--line:#253043;--brand:#172844;--brand2:#a9c4ec;--shadow:0 14px 35px rgba(0,0,0,.28)}
.dark .top{background:rgba(9,14,23,.9)}.dark .iconbtn{background:var(--surface)}
</style>
</head>
<body>
<header class="top">
  <div class="header">
    <a class="brand" href="#inicio" aria-label="Pombo News">
      <div class="logo" style="display:flex;align-items:center;justify-content:center;font-size:1.65rem">🕊️</div>
      <div><strong>🕊️ Pombo News</strong><small>Seu pombo de confiança.</small></div>
    </a>
    <div class="actions">
      <button class="iconbtn" id="searchBtn" aria-label="Buscar">🔎</button>
      <button class="iconbtn" id="themeBtn" aria-label="Modo escuro">🌙</button>
    </div>
  </div>
  <div class="navwrap"><nav class="nav" id="nav"></nav></div>
</header>

<main id="inicio">
  <section id="homeView">
    <div class="hero" id="hero"></div>

    <div class="sectionhead"><h2>📰 Últimas notícias</h2><button id="refreshBtn">↻ Atualizar</button></div>
    <div class="latest" id="latest"></div>

    <div id="sections"></div>
  </section>

  <section id="categoryView" style="display:none">
    <div class="sectionhead"><h2 id="categoryTitle"></h2><button id="backBtn">← Início</button></div>
    <div class="latest" id="categoryGrid"></div>
  </section>

  <section id="savedView" class="saved">
    <div class="sectionhead"><h2>❤️ Notícias salvas</h2><button id="savedBack">← Início</button></div>
    <div class="latest" id="savedGrid"></div>
  </section>
</main>

<div class="search" id="searchModal">
  <div class="searchbox">
    <button class="close" id="closeSearch">×</button>
    <input id="searchInput" placeholder="🔎 O que você procura?" autocomplete="off">
    <div class="results" id="searchResults"></div>
  </div>
</div>

<footer class="footer">
  <div class="footerin">
    <div><strong>🕊️ Pombo News</strong><br>Seu pombo de confiança.</div>
    <div>Início &nbsp;|&nbsp; Sobre &nbsp;|&nbsp; Privacidade<br><small>© 2026 Pombo News</small></div>
  </div>
</footer>

<script>
const CATS=[
 {id:'recife',label:'📍 Recife',icon:'📍',q:['Recife','Recife Pernambuco']},
 {id:'brasil',label:'🇧🇷 Brasil',icon:'🇧🇷',q:['Brasil','política Brasil']},
 {id:'mundo',label:'🌎 Mundo',icon:'🌎',q:['mundo','internacional']},
 {id:'economia',label:'💰 Economia',icon:'💰',q:['economia Brasil','mercado Brasil']},
 {id:'esportes',label:'⚽ Esportes',icon:'⚽',q:['esportes Brasil','futebol Brasil']},
 {id:'entretenimento',label:'🎬 Entretenimento',icon:'🎬',q:['entretenimento Brasil','cinema música TV Brasil']},
 {id:'tecnologia',label:'💻 Tecnologia',icon:'💻',q:['tecnologia Brasil','internet inteligência artificial Brasil']},
 {id:'saude',label:'❤️ Saúde',icon:'❤️',q:['saúde Brasil','saúde e bem-estar Brasil']},
 {id:'fofocas',label:'⭐ Fofocas',icon:'⭐',q:['famosos celebridades Brasil','reality shows Brasil influenciadores']}
];

const feeds=[
 ['G1','https://g1.globo.com/rss/g1/'],['UOL','https://rss.uol.com.br/feed/noticias.xml'],
 ['Agência Brasil','https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml'],
 ['CNN Brasil','https://www.cnnbrasil.com.br/feed/'],['Folha','https://feeds.folha.uol.com.br/emcimadahora/rss091.xml'],
 ['JC','https://jc.ne10.uol.com.br/blogs/rss.xml'],['Diário de Pernambuco','https://www.diariodepernambuco.com.br/rss'],
 ['GE','https://ge.globo.com/rss/'],['Omelete','https://www.omelete.com.br/rss'],['Canaltech','https://canaltech.com.br/rss/'],
 ['TecMundo','https://www.tecmundo.com.br/rss'],['gshow','https://gshow.globo.com/rss/'],
 ['Quem','https://revistaquem.globo.com/rss/'],['InfoMoney','https://www.infomoney.com.br/feed/']
];

let items=[], active='inicio', slide=0, timer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const now=()=>Date.now();
const age=d=>{let m=Math.max(0,Math.floor((now()-new Date(d).getTime())/60000));return m<1?'Atualizado agora':`Atualizado há ${m} min`};
const fresh=d=>{let t=new Date(d).getTime();return Number.isFinite(t)&&t<=now()+10*60000&&t>=now()-72*3600000};

function fallback(cat){
 const c=CATS.find(x=>x.id===cat)||{icon:'📰',label:'Pombo News'};
 return `<div class="fallback">${c.icon}<span>${esc(c.label.replace(/^\\S+\\s/,''))}</span></div>`;
}
function card(n,mini=false){
 return `<article class="card ${mini?'mini':''}">
   <a href="${esc(n.url)}" target="_blank" rel="noopener">
    <div class="thumb">${n.image?`<img src="${esc(n.image)}" loading="lazy" onerror="this.outerHTML='${fallback(n.cat).replace(/'/g,"&#39;")}'">`:fallback(n.cat)}</div>
    <div class="cardbody"><div class="cat">${esc((CATS.find(c=>c.id===n.cat)||{}).label||n.cat)}</div>
    <h3>${esc(n.title)}</h3><div class="cardmeta">${esc(n.source)} · ${age(n.date)}</div>
    <button class="saveBtn" data-save="${esc(n.url)}" style="margin-top:9px;border:0;background:none;color:var(--brand2);font-weight:800">♡ Salvar</button></div>
   </a>
 </article>`;
}
function renderHero(){
 const six=items.slice(0,6); if(!six.length){$('#hero').innerHTML='<div class="heroFallback" style="height:100%"><div style="text-align:center;color:#fff"><div style="font-size:5rem">🕊️</div><div style="font-weight:800;font-size:1rem;opacity:.8">O pombo está chegando com as notícias...</div></div></div>';return}
 $('#hero').innerHTML=six.map((n,i)=>`<article class="slide ${i===slide?'active':''}">
   ${n.image?`<img src="${esc(n.image)}" alt="" onerror="this.style.display='none'">`:`<div class="heroFallback">${(CATS.find(c=>c.id===n.cat)||{}).icon||'📰'}</div>`}
   <div class="slidecontent"><span class="badge">${esc((CATS.find(c=>c.id===n.cat)||{}).label||'Notícia')}</span>
   <h1>${esc(n.title)}</h1><div class="meta">${esc(n.source)} · ${age(n.date)}</div>
   <a class="read" href="${esc(n.url)}" target="_blank" rel="noopener">Ler notícia</a></div>
 </article>`).join('')+`<div class="dots">${six.map((_,i)=>`<button class="dot ${i===slide?'active':''}" data-slide="${i}"></button>`).join('')}</div>`;
 $('#hero').querySelectorAll('.dot').forEach(b=>b.onclick=()=>{slide=+b.dataset.slide;renderHero()});
}
function renderHome(){
 renderHero();
 const top=items.slice(0,12);
 $('#latest').innerHTML=top.length?top.map(n=>card(n)).join(''):`<div class="empty">🕊️ Calma, o pombo está buscando a notícia...</div>`;
 $('#sections').innerHTML=CATS.map(c=>{
   const arr=items.filter(n=>n.cat===c.id).slice(0,4);
   return `<section><div class="sectionhead"><h2>${c.label}</h2><button data-cat="${c.id}">Ver todas</button></div>
   ${arr.length?`<div class="grid">${arr.map(n=>card(n,true)).join('')}</div>`:`<div class="empty">Ainda não encontramos notícias recentes.</div>`}</section>`;
 }).join('');
 $('#sections').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>showCategory(b.dataset.cat));
 bindSaveButtons();
}
function bindSaveButtons(){
 document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{
   e.preventDefault();e.stopPropagation();
   const u=b.dataset.save;let a=JSON.parse(localStorage.getItem('pn-saved-v1')||'[]');
   a=a.includes(u)?a.filter(x=>x!==u):[...a,u];localStorage.setItem('pn-saved-v1',JSON.stringify(a));
   b.textContent=a.includes(u)?'♥ Salvo':'♡ Salvar';
 });
}
function showCategory(id){
 active=id;$('#homeView').style.display='none';$('#categoryView').style.display='block';$('#savedView').style.display='none';
 const c=CATS.find(x=>x.id===id);$('#categoryTitle').textContent=c.label+' — Notícias mais recentes';
 const arr=items.filter(n=>n.cat===id).slice(0,20);
 $('#categoryGrid').innerHTML=arr.length?arr.map(n=>card(n)).join(''):`<div class="empty">🕊️ Nenhuma notícia recente encontrada.</div>`;
 bindSaveButtons();
 window.scrollTo({top:0,behavior:'smooth'});
}
function showSaved(){
  active='saved';
  $('#homeView').style.display='none';$('#categoryView').style.display='none';$('#savedView').style.display='block';
  const saved=JSON.parse(localStorage.getItem('pn-saved-v1')||'[]');
  const arr=items.filter(n=>saved.includes(n.url)).slice(0,20);
  $('#savedGrid').innerHTML=arr.length?arr.map(n=>card(n)).join(''):'<div class="empty">Você ainda não salvou nenhuma notícia.</div>';
  bindSaveButtons();
  window.scrollTo({top:0,behavior:'smooth'});
}
function showHome(){active='inicio';$('#homeView').style.display='block';$('#categoryView').style.display='none';$('#savedView').style.display='none';renderHome();window.scrollTo({top:0,behavior:'smooth'})}
function initNav(){
 $('#nav').innerHTML='<button class="active" data-home>🏠 Início</button>'+CATS.map(c=>`<button data-cat="${c.id}">${c.label}</button>`).join('')+'<button data-saved>❤️ Salvos</button>';
 $('#nav').querySelector('[data-home]').onclick=showHome;
 $('#nav').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>showCategory(b.dataset.cat));
 $('#nav').querySelector('[data-saved]').onclick=showSaved;

}
function parseRSS(txt,cat,source){
 const x=new DOMParser().parseFromString(txt,'text/xml'); let nodes=[...x.querySelectorAll('item')];
 if(!nodes.length) nodes=[...x.querySelectorAll('entry')];
 return nodes.map(n=>({title:n.querySelector('title')?.textContent?.trim()||'',url:n.querySelector('link')?.getAttribute('href')||n.querySelector('link')?.textContent?.trim()||'',date:n.querySelector('pubDate')?.textContent||n.querySelector('published')?.textContent||n.querySelector('updated')?.textContent||'',image:n.querySelector('enclosure')?.getAttribute('url')||n.querySelector('media\\:content')?.getAttribute('url')||'',cat,source})).filter(n=>n.title&&n.url&&fresh(n.date));
}

async function rssJson(feedUrl, cat, source){
  const api='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feedUrl);
  const r=await fetch(api,{cache:'no-store'});
  if(!r.ok) throw Error('HTTP '+r.status);
  const d=await r.json();
  if(d.status!=='ok' || !Array.isArray(d.items)) throw Error('feed');
  return d.items.map(x=>({
    title:x.title||'',
    url:x.link||x.guid||'',
    date:x.pubDate||'',
    image:x.thumbnail || (x.enclosure && x.enclosure.link) || '',
    cat, source
  })).filter(n=>n.title&&n.url&&fresh(n.date));
}

async function googleSearch(cat,q,source='Google Notícias'){
  const feed='https://news.google.com/rss/search?q='+encodeURIComponent(q+' when:3d')+'&hl=pt-BR&gl=BR&ceid=BR:pt-419';
  try{
    const rows=await rssJson(feed,cat,source);
    return rows.slice(0,12);
  }catch(e){ return []; }
}

async function fetchFeed(f,cat){
  try{
    return (await rssJson(f[1],cat,f[0])).slice(0,8);
  }catch(e){
    return [];
  }
}

const SOURCE_QUERIES={
  recife:['site:g1.globo.com/pe/pernambuco/recife','site:jc.ne10.uol.com.br Recife','site:diariodepernambuco.com.br Recife','site:folhape.com.br Recife'],
  brasil:['site:g1.globo.com Brasil','site:cnnbrasil.com.br Brasil','site:uol.com.br Brasil','site:agenciabrasil.ebc.com.br Brasil'],
  mundo:['site:g1.globo.com/mundo','site:cnnbrasil.com.br/internacional','site:uol.com.br internacional','site:agenciabrasil.ebc.com.br internacional'],
  economia:['site:g1.globo.com/economia','site:cnnbrasil.com.br/economia','site:infomoney.com.br economia','site:folha.uol.com.br mercado'],
  esportes:['site:ge.globo.com esportes','site:espn.com.br esportes','site:uol.com.br/esporte','site:g1.globo.com/esportes'],
  entretenimento:['site:g1.globo.com/pop-arte','site:omelete.com.br','site:gshow.globo.com','site:uol.com.br/splash'],
  tecnologia:['site:canaltech.com.br','site:tecmundo.com.br','site:olhardigital.com.br','site:g1.globo.com/tecnologia'],
  saude:['site:g1.globo.com/saude','site:cnnbrasil.com.br/saude','site:uol.com.br/vivabem','site:agenciabrasil.ebc.com.br/saude'],
  fofocas:['site:uol.com.br/splash','site:gshow.globo.com','site:revistaquem.globo.com','site:metropoles.com/entretenimento']
};

async function refresh(){
  $('#refreshBtn').textContent='⟳ Atualizando...';
  const out=[];
  const jobs=[];

  for(const c of CATS){
    const relevant=feeds.filter(f=>{
      if(c.id==='recife') return ['G1','JC','Diário de Pernambuco','Folha'].includes(f[0]);
      if(c.id==='brasil') return ['G1','UOL','Agência Brasil','CNN Brasil','Folha'].includes(f[0]);
      if(c.id==='mundo') return ['G1','UOL','CNN Brasil','Agência Brasil'].includes(f[0]);
      if(c.id==='economia') return ['G1','UOL','CNN Brasil','Folha','InfoMoney'].includes(f[0]);
      if(c.id==='esportes') return ['G1','GE','UOL'].includes(f[0]);
      if(c.id==='entretenimento') return ['G1','UOL','Omelete','gshow','Quem'].includes(f[0]);
      if(c.id==='tecnologia') return ['G1','UOL','Canaltech','TecMundo'].includes(f[0]);
      if(c.id==='saude') return ['G1','UOL','CNN Brasil','Agência Brasil'].includes(f[0]);
      if(c.id==='fofocas') return ['UOL','gshow','Quem'].includes(f[0]);
      return false;
    }).slice(0,5);

    for(const f of relevant) jobs.push(fetchFeed(f,c.id));
    for(const q of (SOURCE_QUERIES[c.id]||[]).slice(0,4)) jobs.push(googleSearch(c.id,q));
  }

  // Keep browser/network load controlled: four requests at a time.
  for(let i=0;i<jobs.length;i+=4){
    const batch=await Promise.allSettled(jobs.slice(i,i+4));
    batch.forEach(r=>{if(r.status==='fulfilled'&&Array.isArray(r.value))out.push(...r.value)});
  }

  const map=new Map();
  out.filter(n=>fresh(n.date)).forEach(n=>{
    const key=(n.url||n.title).replace(/[?#].*$/,'');
    if(!map.has(key)) map.set(key,n);
  });

  // Keep category diversity and cap at 20 per category.
  const byCat={};
  CATS.forEach(c=>byCat[c.id]=[]);
  [...map.values()].sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(n=>{
    if(byCat[n.cat] && byCat[n.cat].length<20) byCat[n.cat].push(n);
  });

  items=CATS.flatMap(c=>byCat[c.id]).sort((a,b)=>new Date(b.date)-new Date(a.date));
  localStorage.setItem('pn-items-v2',JSON.stringify({at:now(),items}));
  renderHome();
  $('#refreshBtn').textContent='↻ Atualizar';
}

function load(){
 initNav();
 try{const c=JSON.parse(localStorage.getItem('pn-items-v2'));if(c&&now()-c.at<6*3600000)items=(c.items||[]).filter(n=>fresh(n.date))}catch(e){}
 renderHome();
 setTimeout(refresh,100);
}
$('#refreshBtn').onclick=refresh;
$('#backBtn').onclick=showHome;$('#savedBack').onclick=showHome;
$('#searchBtn').onclick=()=>{$('#searchModal').style.display='block';$('#searchInput').focus()};
$('#closeSearch').onclick=()=>$('#searchModal').style.display='none';
$('#searchModal').onclick=e=>{if(e.target.id==='searchModal')$('#searchModal').style.display='none'};
$('#searchInput').oninput=e=>{
 const q=e.target.value.trim().toLowerCase();
 const r=items.filter(n=>(n.title+' '+n.source+' '+n.cat).toLowerCase().includes(q)).slice(0,20);
 $('#searchResults').innerHTML=q?(r.length?r.map(n=>`<div class="result"><a href="${esc(n.url)}" target="_blank" rel="noopener"><b>${esc(n.title)}</b><small>${esc(n.source)} · ${age(n.date)}</small></a></div>`).join(''):'<div class="empty">Nenhuma notícia encontrada.</div>'):'';
};
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('pn-dark',document.body.classList.contains('dark')?'1':'0')};
if(localStorage.getItem('pn-dark')==='1')document.body.classList.add('dark');
setInterval(()=>{renderHome()},60000);
load();
</script>
</body>
</html>
